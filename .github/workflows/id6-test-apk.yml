name: BMW ID6 CarPlay test APK

on:
  push:
    branches:
      - feature/carplay-id6-test-pattern
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-build
      - name: Format Kotlin and compile test APK
        run: |
          ./gradlew --no-daemon --console=plain spotlessApply :app:assembleStandardDebug
      - name: Upload APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bmw-id6-test-apk
          path: app/build/outputs/apk/standard/debug/app-standard-debug.apk
          if-no-files-found: error
          retention-days: 14
